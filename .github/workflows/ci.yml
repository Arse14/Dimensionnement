name: Compilation et tests

on:
  push:
    branches: [main]
    # Une étiquette vX.Y.Z publie une release GitHub avec l'exécutable.
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilation
        run: dotnet build Dimensionnement.sln -c Release

      - name: Tests du moteur de calcul
        run: dotnet test tests/Dimensionnement.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publication de l'exécutable Windows
        shell: pwsh
        run: |
          # Sur une étiquette vX.Y.Z, l'exécutable porte ce numéro de version.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          dotnet publish src/Dimensionnement.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o publication

      - uses: actions/upload-artifact@v4
        with:
          name: Dimensionnement-windows-x64
          path: publication/

  # Release GitHub sur une étiquette vX.Y.Z : l'exécutable zippé en pièce jointe.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dimensionnement-windows-x64
          path: publication
      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publication && zip -r "../Dimensionnement-${{ github.ref_name }}-windows-x64.zip" . && cd ..
          gh release create "${{ github.ref_name }}" "Dimensionnement-${{ github.ref_name }}-windows-x64.zip" \
            --repo "${{ github.repository }}" --title "Dimensionnement ${{ github.ref_name }}" --generate-notes

  # Ne garde que les 3 derniers exécutables publiés, toutes branches confondues.
  menage:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Suppression des anciens exécutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "Dimensionnement-windows-x64" and (.expired | not)) | "\(.created_at) \(.id)"' \
            | sort -r | tail -n +4 | while read -r date id; do
              echo "Suppression de l'exécutable du $date ($id)"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
